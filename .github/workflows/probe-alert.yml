name: Manual Probe Alert

# 目的：手册可用性探针（patrol-trigger Worker 每 5 分钟一次）的告警/恢复通知通道。
#   2026-11-08 整改：告警改发「许磊的智能助手」单聊（send 逻辑在 probe_dm.py，open_id 已硬编码），
#   触发阈值连续 6 次（30 分钟持续不可用）；探针超时 25 秒。
#   v2 修复：弃用 heredoc（缩进导致 IndentationError），改用仓库脚本 probe_dm.py。

on:
  workflow_dispatch:
    inputs:
      alert_type:
        description: "alert=不可用 / recover=已恢复 / test=通道测试"
        required: true
        type: string
      streak:
        description: "连续失败次数"
        required: false
        type: string
        default: "0"
      dur_min:
        description: "持续时长（分钟，约）"
        required: false
        type: string
        default: "0"
      detail:
        description: "失败形态（HTTP/超时等）"
        required: false
        type: string
        default: ""

concurrency:
  group: probe-alert
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      ALERT_TYPE: ${{ inputs.alert_type }}
      STREAK: ${{ inputs.streak }}
      DUR_MIN: ${{ inputs.dur_min }}
      DETAIL: ${{ inputs.detail }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send DM to XuLei Assistant
        run: python probe_dm.py "$ALERT_TYPE" "$STREAK" "$DUR_MIN" "$DETAIL"
      - name: Note on failure
        if: failure()
        run: echo "probe-alert send failed — check FEISHU_APP_SECRET / probe_dm.py"
