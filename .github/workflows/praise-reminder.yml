name: Daily Praise Reminder (10:00 CST)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD（留空=今天；测试时可填历史日期）"
        required: false
        default: ""
      dry_run:
        description: "只演练不实际发消息（排障用）"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *" # 10:00 北京时间（UTC+8）

concurrency:
  group: praise-reminder
  cancel-in-progress: false

jobs:
  praise-reminder:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUD_CHAIN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_ALERT_WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
      FEISHU_BASE_TOKEN: Qd4ubeDLVazKBrspvMXcSY1Xn5c
      FEISHU_SUMMARY_TABLE: tblG2f1FnNCUyFSM
      FEISHU_SCHED_TABLE: tblVDbIezF6DSH6D
      FEISHU_TAB_TABLE: tbl37M2meI0EG3bM
      FEISHU_QUEUE_TABLE: tblSTXDvYP8rKlaC
      FEISHU_DAILY_DOC: GlpCduwAropB88xvWpLcuEFinff
      FEISHU_CHAT_ID: oc_485dd8d59a0115a43870c289994f429d
      RUN_DATE: ${{ inputs.date }}
      RUN_DRY: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send reminders (duty-checked)
        run: |
          ARGS="--mode send"
          if [ -n "$RUN_DATE" ]; then ARGS="$ARGS --date $RUN_DATE"; fi
          if [ "$RUN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m summary_chain.praise_reminder $ARGS
      - name: Wait 20 minutes for read
        if: ${{ env.RUN_DRY != 'true' }}
        run: sleep 1200
      - name: Verify reads, resend unread
        if: ${{ env.RUN_DRY != 'true' }}
        run: |
          ARGS="--mode verify"
          if [ -n "$RUN_DATE" ]; then ARGS="$ARGS --date $RUN_DATE"; fi
          python -m summary_chain.praise_reminder $ARGS
      - name: Alert on failure
        if: failure()
        run: |
          curl -sS -X POST "$FEISHU_ALERT_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"🚨【云端提醒任务执行失败】\\n任务：${{ github.workflow }}\\n日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" || true
