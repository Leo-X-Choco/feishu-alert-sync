name: sync-feishu-alerts

# 触发方式：
# 1. 外部调度器按点调 workflow_dispatch API（2026-09-22 起的主通道）：
#    · Cloudflare Worker `patrol-trigger`（主通道，每 30 分钟）
#    · 本机 patrol_daemon.py（兜底通道，先查当天是否已跑，未跑才补触发）
# 2. 手动触发：仓库 Actions 页面 -> 本工作流 -> Run workflow
#
# 🔴 2026-09-22 停用 GitHub schedule（原 cron: "*/30 * * * *"）：
#    —— 09-21 那次 "*/10" → "*/30" 降频【已被证伪】：降频后反而更差，说明瓶颈
#       不是本工作流的频率，而是 GitHub 对整仓 schedule 事件的放行率崩塌。
#    实测（3 日对照）：
#      · 提醒延迟：09-16~09-18 仅 2~11 分钟 → 09-22 好评提醒 +4h59m，15:30 / 17:30 未跑
#      · 本工作流触发次数：80/82/88 次/天 → 26 → 7 → 5 → 2 次/天（应 48）
#      · 看门狗自身：09-21 迟到 6h12m 且执行失败
#      · 决定性对照：schedule 延迟 4h59m；workflow_dispatch 仅 1 秒（15:03:56 发出
#        → 15:03:57 落地，HTTP 204）⇒ 解法 = 外部调度器到点调 dispatch API
#    安全性：sync_alerts.py 走 LOOKBACK_HOURS=48 窗口 + 按消息 ID 去重，
#            幂等、重复运行安全，调度中断后补跑不会漏数据也不会重复入库。
#    回滚：取消下面两行注释（注意会与 dispatch 触发产生重复运行）。
on:
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync alerts to Bitable
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_ALERT_WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
          LOOKBACK_HOURS: "48"
        run: python sync_alerts.py

  # 兜底告警：sync 失败时（包括脚本整体崩溃、超时等未触发脚本内告警的场景），
  # 由 GitHub Actions 直接发飞书群机器人消息
  notify-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu failure alert
        env:
          FEISHU_ALERT_WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_ALERT_WEBHOOK" ]; then
            echo "未配置 FEISHU_ALERT_WEBHOOK，跳过兜底告警（请配置后启用）"
            exit 0
          fi
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          TEXT="🚨【预警同步失败·兜底提醒】 时间：${TS} 请检查运行日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(python3 -c "import json,sys;print(json.dumps({'msg_type':'text','content':{'text':sys.argv[1]}},ensure_ascii=False))" "$TEXT")
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$FEISHU_ALERT_WEBHOOK"
