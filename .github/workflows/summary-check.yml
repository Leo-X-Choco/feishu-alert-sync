name: Daily Summary Check (15:30 CST)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD（留空=今天；测试时可填历史日期）"
        required: false
        default: ""
      dry_run:
        description: "只演练不实际发消息（排障用）"
        required: false
        type: boolean
        default: false
  # 🔴 2026-09-22 停用 schedule：GitHub 对本仓 schedule 事件的放行率自 09-19 起崩塌
  #    （实测提醒延迟 4~7 小时、法务同步触发次数从 88/天 掉到 2/天，排队任务还会被丢弃）。
  #    改由外部调度器按点调 workflow_dispatch API 触发：
  #      · Cloudflare Worker `patrol-trigger`（主通道）
  #      · 本机 patrol_daemon.py（兜底通道）
  #    计划时刻：15:30 CST（原 cron: "30 7 * * *"）
  #    回滚：取消下面两行注释（注意会与 dispatch 触发产生重复运行）。
  # schedule:
  #   - cron: "30 7 * * *" # 15:30 北京时间（UTC+8）

concurrency:
  group: summary-check
  cancel-in-progress: false

jobs:
  summary-check:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUD_CHAIN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_ALERT_WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
      FEISHU_BASE_TOKEN: Qd4ubeDLVazKBrspvMXcSY1Xn5c
      FEISHU_SUMMARY_TABLE: tblG2f1FnNCUyFSM
      FEISHU_SCHED_TABLE: tblVDbIezF6DSH6D
      FEISHU_TAB_TABLE: tbl37M2meI0EG3bM
      FEISHU_QUEUE_TABLE: tblSTXDvYP8rKlaC
      FEISHU_DAILY_DOC: GlpCduwAropB88xvWpLcuEFinff
      FEISHU_CHAT_ID: oc_485dd8d59a0115a43870c289994f429d
      RUN_DATE: ${{ inputs.date }}
      RUN_DRY: ${{ inputs.dry_run }}
      # 2026-09-20：主 Base 的 15 张业务表已迁 Cloudflare D1，云端读优先走 D1。
      # 未配置该 secret 时 d1_db.enabled() 为 False，自动回退旧飞书通道（回滚开关）。
      WB_PROXY_TOKEN: ${{ secrets.WB_PROXY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Data channel self-check
        run: |
          python -c "from summary_chain import d1_db as d; print('[channel] d1_enabled=%s targets=%s token_len=%d' % (d.enabled(), d.TARGETS, len(d.TOKEN)))"
      - name: Check & remind (sync disabled since 2026-09-08)
        run: |
          ARGS="--mode check"
          if [ -n "$RUN_DATE" ]; then ARGS="$ARGS --date $RUN_DATE"; fi
          if [ "$RUN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m summary_chain.summary_chain $ARGS
      - name: Consume transfer fallback queue
        if: ${{ env.RUN_DRY != 'true' }}
        run: python -m summary_chain.queue_consumer
      - name: Alert on failure
        if: failure()
        run: |
          curl -sS -X POST "$FEISHU_ALERT_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"🚨【云端提醒任务执行失败】\\n任务：${{ github.workflow }}\\n日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" || true
